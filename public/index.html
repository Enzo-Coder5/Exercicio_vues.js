<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Vue Diretivas - Aula 02</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container mt-5">
    <h1 class="text-success">{{ saudacao }}</h1>

    
    <p v-if="aluno.ativo" class="text-primary">Aluno ativo no curso</p>
    <p v-else class="text-danger">Aluno inativo</p>

    
    <div v-show="mostrarCarga" class="alert alert-info">
      Carga horária: {{ aluno.cargaHoraria }}
    </div>

    
    <img v-bind:src="imagemUrl" alt="Vue logo" class="img-fluid mb-3">

    
    <ul class="list-group mb-3">
      <li class="list-group-item" v-for="(modulo, index) in aluno.modulos" :key="index">
        {{ index + 1 }} - {{ modulo }}
      </li>
    </ul>

    
    <button class="btn btn-warning" v-on:click="mostrarCarga = !mostrarCarga">
      Alternar Carga Horária
    </button>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          saudacao: "Bem-vindo ao curso Vue.js!",
          mostrarCarga: true,
          imagemUrl: "https://vuejs.org/images/logo.png",
          aluno: {
            nome: "Bruce Wayne",
            curso: "Desenvolvimento Web com Vue",
            cargaHoraria: "120 horas",
            ativo: true,
            modulos: ["Introdução", "Interpolação", "Diretivas", "Componentes"]
          }
        }
      }
    });
    app.mount('#app');
  </script>
</body>
</html>
